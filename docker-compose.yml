services:
  postgres:
    image: postgres:17-alpine
    container_name: nexara-postgres
    environment:
      POSTGRES_USER: nexara
      POSTGRES_PASSWORD: nexara
      POSTGRES_DB: nexara
    ports:
      - "5434:5432"
    volumes:
      - nexara_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexara -d nexara"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nexara_pgdata:
